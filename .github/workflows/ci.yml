name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile — format, lint, type-check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Backend — build, tests
    # Windows matches the IIS deployment target (spec §13).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - run: dotnet restore OnePondy.sln
      - run: dotnet build OnePondy.sln --no-restore --configuration Release
      # Database tests skip themselves unless ONEPONDY_TEST_DATABASE is set.
      - run: dotnet test OnePondy.sln --no-build --configuration Release
